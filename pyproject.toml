[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hooklint"
version = "0.1.0"
description = "Offline, deterministic linter for agent hook/skill/MCP configs -- parses, never executes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ethan Haas" }]
keywords = ["claude-code", "cursor", "agent", "hooks", "mcp", "lint", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=5.1",
    "tomli>=1.2 ; python_version < \"3.11\"",
]

[project.scripts]
hooklint = "hooklint.cli:main"

[project.urls]
Homepage = "https://github.com/ethan-haas/hooklint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
